<!DOCTYPE html>
<html>
<head>
    <title>Student Directory</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 60px 20px;
        }
        h1 {
            text-align: center;
            color: white;
            font-size: 2.5rem;
            margin-bottom: 40px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
            border-top: 5px solid #667eea;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
        }
        .card h2 {
            color: #764ba2;
            margin-bottom: 12px;
            font-size: 1.4rem;
        }
        .card p {
            color: #555;
            margin: 6px 0;
            font-size: 0.95rem;
        }
        .label {
            font-weight: bold;
            color: #333;
        }
        .empty {
            text-align: center;
            color: white;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <h1>🎓 Student Directory</h1>

    <div class="grid">
        {% for student in students %}
            <div class="card">
                <h2>{{ student.name }}</h2>
                <p><span class="label">Course:</span> {{ student.course }}</p>
                <p><span class="label">Year Level:</span> {{ student.year_level }}</p>
            </div>
        {% empty %}
            <p class="empty">No students yet — add them in the admin!</p>
        {% endfor %}
    </div>
</body>
</html>
